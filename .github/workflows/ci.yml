# Workflow de CI responsável exclusivamente pela execução dos testes unitários.
# Estrutura preparada para expansão futura com novos jobs e etapas de qualidade.

name: Continuous Integration

on:
  push:
    branches:
      - master

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }} # Pegando a secret da variável de ambiente no Github
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Obtém o código-fonte do repositório.
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Configura a versão do Node.js definida nas variáveis globais.
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para disponibilizar o Yarn.
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências respeitando o arquivo yarn.lock.
      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      # Executa exclusivamente a suíte de testes unitários.
      - name: Run Unit Tests
        run: yarn test:unit

  build-and-deploy:
    name: Build & Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest

    steps: 
      # Obtém o código-fonte do repositório.
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Configura a versão do Node.js definida nas variáveis globais.
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para disponibilizar o Yarn.
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências respeitando o arquivo yarn.lock.
      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      # Obtendo as configurações para o Vercel
      - name: Pull Vercel config
        run: yarn vercel pull --yes --environment=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE 

      # Build para o Vercel
      - name: Build Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN

      # Deploy preview
      - name: Deploy preview
        run: yarn vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE
